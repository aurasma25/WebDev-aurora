<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS</title>
    <style>
        p{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: pink;
            font-weight: 500;
        }
        .momo{
            font-style: italic;
        color: maroon;
        font-weight: 500;
        }
        .chiko{
            font-style: italic;
            color: rgb(152, 124, 179);
        }

    </style>
</head>
<body>
    <p style="font-weight: bold; color: red;">Ini adalah kalimat pertama.</p>
    <p>Ini adalah kalimat kedua.</p>
    <p class="momo">Ini adalah kalimat ketiga.</p>
    <p>class="chiko">Ini adalah kalimat keempat.</p>
</body>
</html>
